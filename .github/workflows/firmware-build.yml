name: Firmware build

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: platformio/platformio-action@v1
        with:
          project-dir: firmware
          command: run
